[package]
name = "av1opt"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Cotions/av1opt"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
libc = "0.2.191"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
walkdir = "2.5.0"
tiny_http = { version = "0.12", optional = true }

[features]
default = []
# Local web UI (`av1opt ui`). Off by default so the CLI build stays lean.
ui = ["dep:tiny_http"]
